[package]
name = "hledger-helper"
version = "1.0.0"
license = "MIT OR Apache-2.0"
authors = ["atomicangel"]
edition = "2024"

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1", features = ["full", "macros", "rt"] }
axum = "0.7"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
visibility = "0.1"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.12.0"

[[bin]]
name = "hledger-helper"
path = "src/main.rs"

[lib]
name = "hledger_helper"
path = "src/lib.rs"
