<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stylized ledger book (no border, larger) -->
  <g transform="translate(15, 10) scale(1.2)">
    <!-- Book cover -->
    <rect width="70" height="80" rx="6" fill="url(#grad1)"/>
    
    <!-- Ledger lines -->
    <rect x="7" y="16" width="56" height="3" fill="white" opacity="0.7"/>
    <rect x="7" y="26" width="56" height="3" fill="white" opacity="0.7"/>
    <rect x="7" y="36" width="56" height="3" fill="white" opacity="0.7"/>
    <rect x="7" y="46" width="56" height="3" fill="white" opacity="0.7"/>
    <rect x="7" y="56" width="56" height="3" fill="white" opacity="0.7"/>
    
    <!-- Right margin -->
    <line x1="46" y1="13" x2="46" y2="67" stroke="white" stroke-width="2" opacity="0.5"/>
    
    <!-- Total line -->
    <rect x="7" y="68" width="50" height="2" fill="#66ffaa"/>
  </g>
</svg>
