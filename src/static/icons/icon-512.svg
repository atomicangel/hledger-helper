<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0a"/>
  
  <!-- Stylized ledger book -->
  <g transform="translate(100, 100)">
    <!-- Book cover -->
    <rect width="312" height="312" rx="24" fill="url(#grad1)"/>
    
    <!-- Ledger lines -->
    <rect x="32" y="64" width="248" height="8" fill="white" opacity="0.7"/>
    <rect x="32" y="96" width="248" height="8" fill="white" opacity="0.7"/>
    <rect x="32" y="128" width="248" height="8" fill="white" opacity="0.7"/>
    <rect x="32" y="160" width="248" height="8" fill="white" opacity="0.7"/>
    <rect x="32" y="192" width="248" height="8" fill="white" opacity="0.7"/>
    <rect x="32" y="224" width="248" height="8" fill="white" opacity="0.7"/>
    
    <!-- Right margin -->
    <line x1="200" y1="50" x2="200" y2="290" stroke="white" stroke-width="8" opacity="0.5"/>
    
    <!-- Total line -->
    <rect x="32" y="300" width="220" height="4" fill="#66ffaa"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="380" cy="120" r="20" fill="#00ff88" opacity="0.4"/>
  <circle cx="400" cy="140" r="12" fill="#00cc66" opacity="0.3"/>
</svg>
