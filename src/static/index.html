<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="hledger Helper - Frictionless transaction entry">
  <title>hledger Helper</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1>hledger Helper</h1>
        <div class="header-actions">
          <p class="status-indicator" id="status-indicator">Online</p>
          <span class="pending-indicator" id="pending-indicator">0 pending</span>
          <button id="sync-btn" class="sync-btn hidden">Sync Now</button>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="quick-entry">⚡ Quick Entry</button>
      <button class="tab-btn" data-tab="budget">📊 Budget</button>
    </nav>

    <main class="content">
      <!-- Quick Entry Tab -->
      <section id="quick-entry" class="tab-content active">
        <div class="transaction-form">
          <div class="input-group">
            <label for="payee">Payee</label>
            <input type="text" id="payee" placeholder="Enter payee..." autocomplete="off">
            <div class="transfer-toggle">
              <label for="transfer-mode">
                <input type="checkbox" id="transfer-mode"> Transfer
              </label>
            </div>
          </div>

          <div class="split-section">
            <h3>Split Details</h3>
            <div id="split-rows">
              <!-- Dynamic split rows -->
            </div>
            <button id="add-split" class="btn-secondary">+ Add Line</button>
          </div>
        </div>

        <footer class="form-footer">
          <div class="running-total">
            <span>Total:</span>
            <span id="total-amount">$0.00</span>
          </div>
          <button id="submit-transaction" class="btn-primary">Submit</button>
        </footer>
      </section>

      <!-- Budget Tab -->
      <section id="budget" class="tab-content">
        <div class="budget-header">
          <button id="budget-refresh" class="refresh-btn" title="Refresh budget data" aria-label="Refresh budget data">&#x21bb;</button>
        </div>
        <!-- Hero component container for safe-to-spend display -->
        <div class="safe-to-spend-hero hidden"></div>
        <!-- Dynamic group containers injected by JS -->
        <div id="budget-groups-container"></div>
      </section>
    </main>

  </div>

  <script src="/js/app.js"></script>
</body>
</html>
